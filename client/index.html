<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Chat Room</title>

        <!-- css and js src -->
        <link href="dist/output.css" rel="stylesheet" />
        <script src="client.js?v=1.0.4" defer></script>

        <!-- cdn link -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
    </head>

    <body class="h-screen bg-slate-900 flex items-center justify-center">
        <main class="w-full max-w-2xl h-screen sm:h-[92vh] flex flex-col shadow-2xl sm:rounded-2xl overflow-hidden">
            <!-- Header -->
            <div class="client__chat-header bg-slate-800 px-5 py-4 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-comments text-white text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-white font-semibold leading-tight">Chat Room</h1>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span id="client__connection-status"></span>
                            <span class="text-gray-400 text-xs">
                                <span id="client__online-count">-</span> online
                            </span>
                        </div>
                    </div>
                </div>
                <button id="client__close-connection-btn" class="text-gray-400 hover:text-red-400 transition-colors w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-700 cursor-pointer">
                    <i class="fa-solid fa-xmark fa-lg"></i>
                </button>
            </div>
            <!-- Messages -->
            <section class="bg-slate-100 grow overflow-y-auto p-4">
                <div id="client__messages" class="flex flex-col gap-1"></div>
            </section>
            <!-- Input -->
            <div class="bg-white border-t border-gray-200 px-4 py-3 flex gap-3 items-center shrink-0">
                <input
                    type="text"
                    id="client__input-msg"
                    placeholder="Type a message..."
                    class="flex-1 py-2.5 px-4 bg-gray-100 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                />
                <button
                    id="client__send-msg-btn"
                    class="w-10 h-10 bg-indigo-500 hover:bg-indigo-600 active:bg-indigo-700 rounded-full flex items-center justify-center text-white transition-colors cursor-pointer shrink-0"
                >
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </div>
        </main>
    </body>
</html>
